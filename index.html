<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Email & Password Validation</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --ink: #182033;
        --muted: #64748b;
        --line: #dbe3ef;
        --purple: #6754e8;
        --purple-dark: #4f3dc7;
        --bg: #f2f5fb;
        --error: #b42318;
        --success: #087f5b;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background:
          radial-gradient(circle at top left, #e5e1ff, transparent 38%),
          radial-gradient(circle at bottom right, #d8f3f0, transparent 34%),
          var(--bg);
      }
      .login-card {
        width: min(100%, 430px);
        padding: 32px;
        border: 1px solid #ffffff;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 24px 70px rgba(30, 41, 59, 0.13);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
        font-size: 14px;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .brand-mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        color: white;
        background: linear-gradient(135deg, #7c6cf3, #4f3dc7);
        font-size: 19px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 29px;
        letter-spacing: -0.04em;
      }
      .subtitle {
        margin: 0 0 25px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      label {
        display: block;
        margin: 17px 0 7px;
        font-weight: 700;
        font-size: 14px;
      }
      .field {
        position: relative;
      }
      input {
        width: 100%;
        padding: 14px 15px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      input:focus {
        border-color: var(--purple);
        box-shadow: 0 0 0 4px #6754e822;
      }
      input.invalid {
        border-color: var(--error);
      }
      input.valid {
        border-color: var(--success);
      }
      .hint {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .field-error {
        min-height: 17px;
        margin: 5px 0 0;
        color: var(--error);
        font-size: 12px;
      }
      .password-toggle {
        position: absolute;
        right: 8px;
        top: 8px;
        padding: 7px 9px;
        border: 0;
        border-radius: 8px;
        background: #f1efff;
        color: var(--purple-dark);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }
      .password-input {
        padding-right: 76px;
      }
      .login-button {
        width: 100%;
        margin-top: 15px;
        padding: 14px 18px;
        border: 0;
        border-radius: 12px;
        color: #fff;
        background: linear-gradient(135deg, #7666f0, #5140cb);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 9px 18px #6754e82b;
        transition:
          transform 0.15s,
          opacity 0.15s;
      }
      .login-button:hover {
        transform: translateY(-1px);
      }
      .login-button:active {
        transform: translateY(0);
      }
      .login-button:focus-visible {
        outline: 3px solid #b9b0ff;
        outline-offset: 3px;
      }
      .status {
        display: none;
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 11px;
        font-size: 14px;
        line-height: 1.5;
      }
      .status.error {
        display: block;
        color: var(--error);
        background: #fff0ef;
        border: 1px solid #ffd0cc;
      }
      .status.success {
        display: block;
        color: var(--success);
        background: #eafaf3;
        border: 1px solid #b7efd5;
      }
      .footer {
        margin: 21px 0 0;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }
      .footer strong {
        color: #4f3dc7;
      }
      @media (max-width: 480px) {
        body {
          padding: 14px;
        }
        .login-card {
          padding: 24px 20px;
          border-radius: 20px;
        }
        h1 {
          font-size: 26px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-card">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">✉</span> MAILSPACE
      </div>
      <h1>Welcome back</h1>
      <p class="subtitle">
        Sign in with your email and password. This demo validates the format
        using JavaScript regular expressions.
      </p>

      <form id="loginForm" novalidate>
        <label for="email">Email address</label>
        <div class="field">
          <input
            id="email"
            name="email"
            type="text"
            inputmode="email"
            autocomplete="username"
            placeholder="you@example.com"
            aria-describedby="emailHint emailError"
          />
        </div>
        <p class="hint" id="emailHint">Example: learner@example.com</p>
        <p class="field-error" id="emailError" aria-live="polite"></p>

        <label for="password">Password</label>
        <div class="field">
          <input
            class="password-input"
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            aria-describedby="passwordHint passwordError"
          />
          <button class="password-toggle" id="togglePassword" type="button">
            Show
          </button>
        </div>
        <p class="hint" id="passwordHint">
          8–12 characters, with uppercase, lowercase, digit and special
          character (@ # - $ ^).
        </p>
        <p class="field-error" id="passwordError" aria-live="polite"></p>

        <button class="login-button" type="submit">
          Login securely <span aria-hidden="true">→</span>
        </button>
        <div
          class="status"
          id="statusMessage"
          role="status"
          aria-live="polite"
        ></div>
      </form>
      <p class="footer">
        JavaScript practice · <strong>Regex + DOM events</strong>
      </p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
